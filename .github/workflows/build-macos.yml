name: build-macos

# Builds and smoke-tests the macOS menu-bar app on a real Mac. This exists
# because the app was ported to macOS from a Windows-only dev machine with
# no Mac/Xcode available there — everything could be cross-compiled, but
# nothing could actually be *run* until it reaches real macOS hardware.
# Manual trigger only for now, to avoid spending macOS runner minutes
# (billed at a higher multiplier than Linux) on every push.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      # Publishes both architectures, merges them into one universal build
      # with lipo, ad-hoc signs it, and packages the single .pkg — all inside
      # the script, since lipo/codesign/pkgbuild are only available here on
      # a real Mac.
      - name: Build universal .pkg (arm64 + x64)
        run: pwsh scripts/package-mac.ps1

      - name: Launch smoke test
        run: |
          set -e
          APP="dist/mac/bundle-universal/AI Chat RTL Fixer.app/Contents/MacOS/AI.ChatRTLFixer.Mac"
          chmod +x "$APP"
          "$APP" &
          PID=$!
          sleep 5
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "App exited within 5s of launch — treating as a crash."
            exit 1
          fi
          echo "App is running after 5s (pid $PID). Killing for cleanup."
          kill "$PID"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-builds-${{ github.run_number }}
          path: dist/mac/*.pkg
          retention-days: 14
